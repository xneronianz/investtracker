name: Update News

on:
  schedule:
    - cron: '0 1,7,13 * * *'  # 3x daily: 8am, 2pm, 8pm Bangkok time
  workflow_dispatch:

jobs:
  update-news:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Fetch latest news
        run: node fetch-news.js
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
      - name: Commit news.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add news.json
          git diff --staged --quiet || git commit -m "chore: update news $(date -u '+%Y-%m-%d %H:%M UTC')"
          git push
